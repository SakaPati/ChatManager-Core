plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.18-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.142' apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    repositories {
        mavenCentral()
        maven {
            name = "ferra13671-maven"
            url = "https://ferra13671.github.io/maven/"
        }
        maven { url "https://maven.shedaniel.me/" }
    }

    pluginManager.withPlugin('java') {
        base.archivesName = "${rootProject.archives_name}-${project.parent.name}-${project.name}"

        java { withSourcesJar() }

        def commonDir  = "$rootDir/common"
        def versionDir = "$rootDir/common/versions/${project.name}"

        sourceSets {
            main {
                java.srcDirs "$commonDir/src/main/java", "$versionDir/src/main/java"
                resources.srcDirs "$commonDir/src/main/resources", "$versionDir/src/main/resources"
            }
            test {
                java.srcDirs "$commonDir/src/test/java", "$versionDir/src/test/java"
                resources.srcDirs "$commonDir/src/test/resources", "$versionDir/src/test/resources"
            }
        }

        tasks.withType(AbstractCopyTask).configureEach {
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }

        dependencies {
            implementation 'com.alphacephei:vosk:0.3.45'
            compileOnly 'org.projectlombok:lombok:1.18.48'
            annotationProcessor 'org.projectlombok:lombok:1.18.48'
            testImplementation platform('org.junit:junit-bom:5.11.0')
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testImplementation 'org.junit.jupiter:junit-jupiter-params'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }

        tasks.withType(Test).configureEach { useJUnitPlatform() }
    }
}

tasks.register('buildAll') {
    group = 'build'
    dependsOn subprojects.collect { proj -> proj.tasks.matching { it.name == 'build' } }
}

tasks.register('build') {
    group = 'build'
    dependsOn tasks.named('buildAll')
}