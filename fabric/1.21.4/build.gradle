plugins { id 'net.fabricmc.fabric-loom-remap' }

def mcVersion = '1.21.4'
def loaderVersion = '0.17.2'

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:17.0.144") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "com.ferra13671:mega-events:1.7.1"
    include "com.ferra13671:mega-events:1.7.1"
    implementation "blue.endless:jankson:1.2.3"
    include "blue.endless:jankson:1.2.3"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}